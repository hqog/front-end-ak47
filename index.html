<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cdn.discordapp.com data:; connect-src https://back-en-ak47.onrender.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="center" id="login"><div class="card" style="text-align:center;padding:2.5rem">
  <h1 style="margin-top:0">Bienvenue</h1><p class="muted">Connecte-toi pour accéder à ton panel.</p>
  <a class="btn" id="loginBtn" href="#">Se connecter avec Discord</a><p id="err" class="hidden" style="color:var(--bad)"></p>
</div></div>

<div id="app" class="hidden">
  <aside>
    <div class="me"><img id="avatar" alt=""><div><b id="username"></b><small class="muted" id="sync"></small></div></div>
    <nav id="nav"></nav>
    <button class="btn ghost" id="logout">Se déconnecter</button>
  </aside>
  <main id="view"></main>
<div id="toast" class="hidden"></div>
</div>

<script src="app.js" defer></script>
</body>
</html>
